name: Build Signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Android project
        run: python3 gen.py

      - name: Generate signing keystore
        run: |
          keytool -genkey -v \
            -keystore keystore.jks \
            -alias clarity \
            -keyalg RSA \
            -keysize 2048 \
            -validity 9125 \
            -storepass clarity123 \
            -keypass clarity123 \
            -dname "CN=Clarity,OU=Dev,O=Recovery,L=Unknown,ST=Unknown,C=US"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: clarity123
          KEY_ALIAS: clarity
          KEY_PASSWORD: clarity123
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clarity-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
